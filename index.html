<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Love Calculation</title>
</head>
<body>
    <section id="intro">
            <div class="logo"><img src="images/person-hearts.svg" alt="person-hearts"> The Love Calculator </div>
    </section>
<div class="content">
    <section id="main">
        <div class="input-group">
            <label for="your-name"></label>
            <input type="text" name="yourName" id="your-name" value="" placeholder="Enter your name">
        </div>
        <div class="heart"></div>
        <div class="input-group">
            <label for="her-name"></label>
            <input type="text" name="herName" id="her-name" value="" placeholder="Enter her name">
        </div>
    </section>
    <div id="btn">
        <button id="btn-calculate">Calculate</button>
        <p id="name"></p>
        <p id="message"></p>
    </div>
</div>
    <script src="index.js"></script>
</body>
</html>
